name: Build ImmortalWrt for NanoPi R1S-H3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc g++ binutils bzip2 flex python3 \
            perl make grep unzip gzip bison patch file wget cpio rsync git \
            libncurses-dev zlib1g-dev libssl-dev gawk gettext ccache ecj \
            fastjar java-propose-classpath libelf-dev bc time

      - name: Clone ImmortalWrt
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git
          cd immortalwrt

      - name: Update feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch DTS for NanoPi R1S-H3
        run: |
          cd immortalwrt
          echo "=== Listing sunxi target directory structure ==="
          find target/linux/sunxi -maxdepth 3 -type d 2>/dev/null || true
          echo ""
          echo "=== Searching for nanopi DTS files ==="
          DTS_FILE=$(find target/linux/sunxi -name "*nanopi*" -name "*.dts" 2>/dev/null | head -1)
          echo "DTS_FILE=$DTS_FILE"
          if [ -n "$DTS_FILE" ]; then
            echo "=== Patching: $DTS_FILE ==="
            sed -i '/&mmc2/,/};/s/status = "disabled";/status = "okay";/' "$DTS_FILE" || true
            grep -n "status" "$DTS_FILE" || true
          else
            echo "No nanopi DTS found, nothing to patch. Continuing..."
          fi

      - name: Apply custom patches
        run: |
          cd immortalwrt
          bash ../patch-dts.sh

      - name: Generate config
        run: |
          cd immortalwrt
          make defconfig
          echo "CONFIG_TARGET_sunxi=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa8=y" >> .config
          echo "CONFIG_TARGET_sunxi_cortexa8_DEVICE_cubietech_nanopi-r1s-h3=y" >> .config
          make defconfig

      - name: Build firmware
        run: |
          cd immortalwrt
          make -j$(nproc) V=s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-sunxi-r1s-h3
          path: immortalwrt/bin/targets/sunxi/cortexa8/*r1s*.*
          retention-days: 7
